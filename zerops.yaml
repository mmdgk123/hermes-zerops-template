zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm install -g 9router || true
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 20128
          httpSupport: true
      initCommands:
        - npm install -g 9router || true
      start: bash ./bootstrap.sh
