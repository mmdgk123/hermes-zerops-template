zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm install -g 9router || true
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 20128
          httpSupport: true
      start: bash ./bootstrap.sh
      # NOTE: no initCommands — npm install 9router runs inside bootstrap.sh
      # because initCommands run in parallel with start (race condition).
